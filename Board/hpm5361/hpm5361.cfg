if {![info exists HPM_SDK_DIR]} {
    set HPM_SDK_DIR D:/MCU/hpm/hpm_sdk
}
add_script_search_dir [file join $HPM_SDK_DIR boards openocd]
source [find interface/cmsis-dap.cfg]
cmsis-dap backend usb_bulk
adapter speed 100
transport select jtag
reset_config srst_only srst_gates_jtag

source [find soc/hpm5300.cfg]

flash bank hpm5361_iflash hpm_xpi 0x80000000 0x100000 1 1 $_TARGET0 0xF3000000 0x5 0x1000

proc init_clock {} {
    mww 0xF4000800 0xFFFFFFFF
    mww 0xF4000810 0xFFFFFFFF
    mww 0xF4000820 0xFFFFFFFF
    mww 0xF4000830 0xFFFFFFFF
}

$_TARGET0 configure -event reset-init {
    init_clock
}

proc hpm_prepare_flash {} {
    hpm_reset_halt
    init_clock
}

proc hpm_reset_halt {} {
    $::_TARGET0 riscv dmi_write 0x10 0x80000003
    sleep 100
    $::_TARGET0 riscv dmi_write 0x10 0x80000001
    sleep 100
    $::_TARGET0 arp_examine
    halt
    wait_halt 2000
}
