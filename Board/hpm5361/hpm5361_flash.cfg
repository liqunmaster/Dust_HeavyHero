# Dust_Hero - HPM5361 烧录配置 (DAP-Link / CMSIS-DAP via JTAG)
# 直接烧录并复位运行:
#   openocd -s D:/MCU/hpm/tools/openocd/tcl -f hpm5361_flash.cfg
# HPM5361 为 RISC-V, 仅支持 JTAG; 固定 1000kHz 保证杜邦线/长线稳定
source [find interface/cmsis-dap.cfg]

adapter speed 1000
transport select jtag

set _CHIP hpm5361
jtag newtap $_CHIP cpu -irlen 5 -expected-id 0x1000563D

set _TARGET0 $_CHIP.cpu0
target create $_TARGET0 riscv -chain-position $_CHIP.cpu -coreid 0
$_TARGET0 configure -work-area-phys 0x00000000 -work-area-size 0x20000 -work-area-backup 0

# Reset soc-clock (与 SDK hpm5300.cfg 保持一致)
proc reset_soc {} {
    sba_write_mem 0xF410001C 24000000
}

# 使能各外设门控时钟后，才可操作 XPI Flash 控制器
proc init_clock {} {
    mww 0xF4000800 0xFFFFFFFF
    mww 0xF4000810 0xFFFFFFFF
    mww 0xF4000820 0xFFFFFFFF
    mww 0xF4000830 0xFFFFFFFF
}

$_TARGET0 configure -event reset-init {
    init_clock
}

# hpm_xpi flash driver
flash bank xpi0 hpm_xpi 0x80000000 0x2000000 1 1 $_TARGET0 0xF3000000 0x5 0x1000

init
halt
init_clock
puts "=== flashing demo.elf ==="
flash write_image erase build/output/demo.elf
puts "=== flash verify ==="
verify_image build/output/demo.elf
reset run
puts "=== DONE ==="
exit